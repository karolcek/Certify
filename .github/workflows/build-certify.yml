name: Build Certify (Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Certify.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release)
        run: msbuild ".\Certify.sln" /p:Configuration=Release /m /verbosity:minimal /p:UseSharedCompilation=false

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certify-release
          path: |
            **\bin\Release\**\*.exe
            **\bin\Release\**\*.dll
            **\bin\Release\**\*.pdb
